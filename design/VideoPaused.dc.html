<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC",
                   "Hiragino Sans GB", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #6fd3ad; text-decoration: none; }
    a:hover { color: #8fe0c1; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #14140f; color: #fbf9f4; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 16px 20px">
    <svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true" style="flex: 0 0 auto">
      <rect x="0" y="0" width="64" height="64" rx="15" fill="#6fd3ad"></rect>
      <path d="M19 41 L13 51 L28 44 Z" fill="#14140f"></path>
      <circle cx="32" cy="29" r="18" fill="#14140f"></circle>
      <rect x="22" y="24" width="20" height="3.2" rx="1.6" fill="#6fd3ad"></rect>
      <rect x="22" y="30" width="20" height="3.2" rx="1.6" fill="#6fd3ad"></rect>
      <rect x="22" y="36" width="12" height="3.2" rx="1.6" fill="#6fd3ad"></rect>
    </svg>
    <div style="flex: 1 1 auto; display: flex; gap: 5px; align-items: center">
      <div style="flex: 1 1 0; height: 6px; border-radius: 3px; background: rgba(251,249,244,.55)"></div>
      <div style="flex: 1 1 0; height: 6px; border-radius: 3px; background: rgba(251,249,244,.55)"></div>
      <div style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #f0b46a"></div>
      <div style="flex: 1 1 0; height: 6px; border-radius: 3px; background: rgba(251,249,244,.22)"></div>
      <div style="flex: 1 1 0; height: 6px; border-radius: 3px; background: rgba(251,249,244,.22)"></div>
      <div style="flex: 1 1 0; height: 6px; border-radius: 3px; background: rgba(251,249,244,.22)"></div>
    </div>
    <div style="flex: 0 0 auto; font-size: 14px; font-weight: 600; color: #6fd3ad">福建话</div>
  </div>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 26px; padding: 0 24px 8px">

    <!-- Stopped: the bars fall flat and turn amber. Movement stopping IS the
         message; no "停了" needed. -->
    <div style="display: flex; align-items: flex-end; gap: 18px; opacity: .5">
      <svg width="54" height="54" viewBox="0 0 24 24" aria-hidden="true" style="flex: 0 0 auto">
        <path d="M4 20 L4 12 L8 12 L8 20 Z" fill="#f0b46a"></path>
        <path d="M10 20 L10 8 L14 8 L14 20 Z" fill="#f0b46a"></path>
        <path d="M16 20 L16 3 L20 3 L20 20 Z" fill="#f0b46a"></path>
        <path d="M2 21 L22 21" stroke="#f0b46a" stroke-width="1.6" stroke-linecap="round"></path>
      </svg>
      <div style="flex: 1 1 auto; display: flex; align-items: flex-end; gap: 5px; height: 44px">
        <div style="width: 7px; height: 6px; border-radius: 4px; background: #f0b46a"></div>
        <div style="width: 7px; height: 6px; border-radius: 4px; background: #f0b46a"></div>
        <div style="width: 7px; height: 6px; border-radius: 4px; background: #f0b46a"></div>
        <div style="width: 7px; height: 6px; border-radius: 4px; background: #f0b46a"></div>
        <div style="width: 7px; height: 6px; border-radius: 4px; background: #f0b46a"></div>
        <div style="width: 7px; height: 6px; border-radius: 4px; background: #f0b46a"></div>
      </div>
    </div>

    <div style="font-size: 33px; font-weight: 600; line-height: 1.42; max-width: 320px; text-wrap: pretty; opacity: .38">
      而且，你现在的保费不等于以后的保费。年纪越大，保费会调高。
    </div>

  </div>

  <!-- One giant play sitting over the dimmed line. Tapping anywhere resumes,
       and the shape says which way it will go. -->
  <div style="position: absolute; left: 0; right: 0; top: 300px; display: flex; justify-content: center">
    <div style="width: 132px; height: 132px; border-radius: 50%; background: rgba(240,180,106,.16); border: 3px solid #f0b46a; display: flex; align-items: center; justify-content: center">
      <svg width="52" height="52" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4 L20 12 L8 20 Z" fill="#f0b46a"></path></svg>
    </div>
  </div>

  <div style="flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 16px; padding: 20px 20px 26px; background: #23231a">

    <div style="width: 62px; height: 62px; border-radius: 50%; border: 2px solid rgba(251,249,244,.28); display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 5 L8 12 L18 19 Z" fill="#fbf9f4"></path>
        <rect x="4" y="5" width="3" height="14" rx="1.5" fill="#fbf9f4"></rect>
      </svg>
    </div>

    <div style="width: 92px; height: 92px; border-radius: 50%; background: #f0b46a; display: flex; align-items: center; justify-content: center">
      <svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4 L20 12 L8 20 Z" fill="#2b1a05"></path></svg>
    </div>

    <div style="width: 62px; height: 62px; border-radius: 50%; border: 2px solid rgba(251,249,244,.28); display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 5 L16 12 L6 19 Z" fill="#fbf9f4"></path>
        <rect x="17" y="5" width="3" height="14" rx="1.5" fill="#fbf9f4"></rect>
      </svg>
    </div>

    <div style="width: 62px; height: 62px; border-radius: 50%; background: rgba(111,211,173,.16); border: 2px solid #6fd3ad; display: flex; align-items: center; justify-content: center">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M6 20 a10 7 0 0 1 20 0 Z" fill="#6fd3ad"></path>
        <path d="M26 17 a3.4 3.4 0 0 1 4 2.4 a3 3 0 0 1 -3.6 2" fill="#6fd3ad"></path>
        <rect x="8" y="20" width="3.4" height="5" rx="1.7" fill="#6fd3ad"></rect>
        <rect x="19" y="20" width="3.4" height="5" rx="1.7" fill="#6fd3ad"></rect>
        <path d="M11 16 a5 4 0 0 1 10 0" stroke="#14140f" stroke-width="1.4" fill="none"></path>
      </svg>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
