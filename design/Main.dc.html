<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC",
                   "Hiragino Sans GB", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #0b5c46; text-decoration: none; }
    a:hover { color: #08402f; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fbf9f4; color: #1a1a17; display: flex; flex-direction: column; overflow: hidden">

  <!-- chrome: identity, and the dialect she is in -->
  <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 16px 18px 14px; background: #ffffff; border-bottom: 1px solid #e3ded1">
    <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true" style="flex: 0 0 auto">
      <rect x="0" y="0" width="64" height="64" rx="15" fill="#0b5c46"></rect>
      <path d="M19 41 L13 51 L28 44 Z" fill="#fbf9f4"></path>
      <circle cx="32" cy="29" r="18" fill="#fbf9f4"></circle>
      <rect x="22" y="24" width="20" height="3.2" rx="1.6" fill="#0b5c46"></rect>
      <rect x="22" y="30" width="20" height="3.2" rx="1.6" fill="#0b5c46"></rect>
      <rect x="22" y="36" width="12" height="3.2" rx="1.6" fill="#0b5c46"></rect>
    </svg>
    <div style="flex: 1 1 auto; font-size: 20px; font-weight: 700; letter-spacing: -0.01em">送给你的</div>
    <div style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 999px; background: #e8f2ee">
      <div style="font-size: 15px; font-weight: 600; color: #0b5c46">福建话</div>
      <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9 L12 15 L18 9" stroke="#0b5c46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg>
    </div>
  </div>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 14px; padding: 18px 18px 0">

    <!-- the new one: everything she needs, nothing she has to choose -->
    <div style="display: flex; flex-direction: column; gap: 12px; background: #ffffff; border: 2px solid #0b5c46; border-radius: 14px; padding: 18px">

      <div style="display: flex; align-items: center; gap: 10px">
        <div style="flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; background: #e8f2ee; color: #0b5c46; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">女</div>
        <div style="flex: 1 1 auto; font-size: 14px; line-height: 1.45; color: #55524a">
          <strong style="font-weight: 700; color: #1a1a17">女儿</strong> 给你的
        </div>
        <div style="flex: 0 0 auto; font-size: 12px; font-weight: 700; color: #ffffff; background: #0b5c46; border-radius: 999px; padding: 5px 10px">新</div>
      </div>

      <div style="font-size: 22px; font-weight: 600; line-height: 1.45; text-wrap: pretty">加了附加险，看病真的不用自己付钱？</div>

      <div style="display: flex; align-items: center; gap: 14px; background: #0b5c46; border-radius: 12px; min-height: 64px; padding: 0 22px">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="flex: 0 0 auto"><path d="M8 5 L19 12 L8 19 Z" fill="#ffffff"></path></svg>
        <div style="flex: 1 1 auto; font-size: 19px; font-weight: 700; color: #ffffff">福建话讲一遍</div>
        <div style="flex: 0 0 auto; font-size: 14px; font-weight: 600; color: #a8ddc9">1分35秒</div>
      </div>

      <div style="font-size: 12px; line-height: 1.5; color: #8a857a">来源 MoneySense · 8月26日</div>

    </div>

    <!-- what she has already heard, quieter -->
    <div style="font-size: 13px; font-weight: 600; color: #8a857a; letter-spacing: 0.02em">听过的</div>

    <div style="display: flex; flex-direction: column; gap: 10px">

      <div style="display: flex; gap: 12px; align-items: center; background: #ffffff; border: 1px solid #e3ded1; border-radius: 14px; padding: 14px 16px">
        <div style="flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%; border: 2px solid #e3ded1; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 L19 12 L8 19 Z" fill="#55524a"></path></svg>
        </div>
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 12px; color: #8a857a">义工 给你的 · 8月19日</div>
          <div style="font-size: 17px; font-weight: 600; line-height: 1.45; color: #55524a">定期存款的高利息，为什么拿到手好像变少了？</div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex: 0 0 auto"><path d="M5 13 L10 18 L19 7" stroke="#0b5c46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg>
      </div>

      <div style="display: flex; gap: 12px; align-items: center; background: #ffffff; border: 1px solid #e3ded1; border-radius: 14px; padding: 14px 16px">
        <div style="flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%; border: 2px solid #e3ded1; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 L19 12 L8 19 Z" fill="#55524a"></path></svg>
        </div>
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 12px; color: #8a857a">女儿 给你的 · 8月12日</div>
          <div style="font-size: 17px; font-weight: 600; line-height: 1.45; color: #55524a">终身保险和定期保险，差在哪里？</div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex: 0 0 auto"><path d="M5 13 L10 18 L19 7" stroke="#0b5c46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg>
      </div>

    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 14px; border: 2px dashed #e3ded1">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7 L20 7 M4 12 L20 12 M4 17 L20 17" stroke="#55524a" stroke-width="2" stroke-linecap="round"></path></svg>
      <div style="font-size: 16px; font-weight: 600; color: #55524a">自己找题目（6）</div>
    </div>

  </div>

  <!-- the one thing said about a specific offer: is the firm licensed -->
  <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-top: 1px solid #e3ded1; background: #fdf1e0">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: 0 0 auto">
      <path d="M6 3 L6 21" stroke="#8a4b00" stroke-width="2" stroke-linecap="round"></path>
      <path d="M6 4 L17 4 L17 12 L6 12" stroke="#8a4b00" stroke-width="2" stroke-linejoin="round" fill="none"></path>
    </svg>
    <div style="flex: 1 1 auto; font-size: 14px; line-height: 1.45; color: #8a4b00; font-weight: 600">卖给你的公司，在MAS的名册里吗？</div>
    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="flex: 0 0 auto"><path d="M9 6 L15 12 L9 18" stroke="#8a4b00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg>
  </div>

</div>
</x-dc>
</body>
</html>
