<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC",
                   "Hiragino Sans GB", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #6fd3ad; text-decoration: none; }
    a:hover { color: #8fe0c1; }
  </style>
</helmet>

<div style="width: 390px; height: 900px; background: #14140f; color: #fbf9f4; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 16px 20px">
    <svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true" style="flex: 0 0 auto">
      <rect x="0" y="0" width="64" height="64" rx="15" fill="#6fd3ad"></rect>
      <path d="M19 41 L13 51 L28 44 Z" fill="#14140f"></path>
      <circle cx="32" cy="29" r="18" fill="#14140f"></circle>
      <rect x="22" y="24" width="20" height="3.2" rx="1.6" fill="#6fd3ad"></rect>
      <rect x="22" y="30" width="20" height="3.2" rx="1.6" fill="#6fd3ad"></rect>
      <rect x="22" y="36" width="12" height="3.2" rx="1.6" fill="#6fd3ad"></rect>
    </svg>
    <div style="flex: 1 1 auto; display: flex; gap: 5px; align-items: center">
      <div style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #6fd3ad"></div>
      <div style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #6fd3ad"></div>
      <div style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #6fd3ad"></div>
      <div style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #6fd3ad"></div>
      <div style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #6fd3ad"></div>
      <div style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #6fd3ad"></div>
    </div>
    <div style="flex: 0 0 auto; font-size: 14px; font-weight: 600; color: #6fd3ad">福建话</div>
  </div>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 22px; padding: 10px 22px 0">

    <!-- "听完了。你可以这样问他" becomes a picture of the act: SHE speaks, HE
         answers. The arrow does the work the sentence was doing. -->
    <svg width="342" height="140" viewBox="0 0 140 58" aria-hidden="true">
      <circle cx="20" cy="20" r="11" fill="#6fd3ad"></circle>
      <rect x="6" y="36" width="28" height="20" rx="10" fill="#6fd3ad"></rect>
      <path d="M44 6 L96 6 a5 5 0 0 1 5 5 L101 27 a5 5 0 0 1 -5 5 L58 32 L48 40 L50 32 L44 32 a5 5 0 0 1 -5 -5 L39 11 a5 5 0 0 1 5 -5 Z" fill="#fbf9f4"></path>
      <path d="M66 13 a5.5 5.5 0 1 1 5.5 5.5 L71.5 22" stroke="#14140f" stroke-width="3.2" stroke-linecap="round" fill="none"></path>
      <circle cx="71.5" cy="27" r="2.1" fill="#14140f"></circle>
      <path d="M108 19 L124 19 M119 14 L124 19 L119 24" stroke="#a8a397" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
      <circle cx="133" cy="20" r="9" fill="#a8a397"></circle>
      <rect x="122" y="35" width="22" height="21" rx="9" fill="#a8a397"></rect>
    </svg>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; gap: 14px; align-items: flex-start">
        <div style="flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; background: #6fd3ad; color: #06251b; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">1</div>
        <div style="flex: 1 1 auto; font-size: 19px; font-weight: 600; line-height: 1.5; padding-top: 3px">这个附加险，我八十岁的时候，保费是多少？</div>
      </div>
      <div style="display: flex; gap: 14px; align-items: flex-start">
        <div style="flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; background: #6fd3ad; color: #06251b; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">2</div>
        <div style="flex: 1 1 auto; font-size: 19px; font-weight: 600; line-height: 1.5; padding-top: 3px">如果以后付不起，可以只取消附加险吗？</div>
      </div>
      <div style="display: flex; gap: 14px; align-items: flex-start">
        <div style="flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; background: #6fd3ad; color: #06251b; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">3</div>
        <div style="flex: 1 1 auto; font-size: 19px; font-weight: 600; line-height: 1.5; padding-top: 3px">看病的时候，我自己最多要付多少？</div>
      </div>
    </div>

  </div>

  <!-- Four wordless exits: hear it again, check the firm, send it on, more.
       The MAS check keeps warn amber, so it never reads as just another button. -->
  <div style="flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 20px; background: #23231a">

    <div style="min-height: 72px; border-radius: 16px; background: #6fd3ad; display: flex; align-items: center; justify-content: center">
      <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12 a7 7 0 1 1 2.4 5.3" stroke="#06251b" stroke-width="2.4" stroke-linecap="round" fill="none"></path>
        <path d="M4 6 L5 12.5 L11 11" stroke="#06251b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
      </svg>
    </div>

    <div style="min-height: 72px; border-radius: 16px; border: 2px solid #f0b46a; background: rgba(240,180,106,.14); display: flex; align-items: center; justify-content: center">
      <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3 L20 6 L20 12 c0 4.4 -3.4 7.6 -8 9 c-4.6 -1.4 -8 -4.6 -8 -9 L4 6 Z" stroke="#f0b46a" stroke-width="2" fill="none"></path>
        <circle cx="11" cy="11" r="3.1" stroke="#f0b46a" stroke-width="2" fill="none"></circle>
        <path d="M13.4 13.4 L16 16" stroke="#f0b46a" stroke-width="2" stroke-linecap="round"></path>
      </svg>
    </div>

    <div style="min-height: 72px; border-radius: 16px; border: 2px solid rgba(251,249,244,.28); display: flex; align-items: center; justify-content: center">
      <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 13 c5 -8 11 -8 15 -8" stroke="#fbf9f4" stroke-width="2.2" stroke-linecap="round" fill="none"></path>
        <path d="M14 1 L20 5 L14 9" stroke="#fbf9f4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
        <path d="M4 13 L4 20 L20 20" stroke="#fbf9f4" stroke-width="2.2" stroke-linecap="round" fill="none"></path>
      </svg>
    </div>

    <div style="min-height: 72px; border-radius: 16px; border: 2px solid rgba(251,249,244,.28); display: flex; align-items: center; justify-content: center">
      <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7 L20 7 M4 12 L20 12 M4 17 L20 17" stroke="#fbf9f4" stroke-width="2.2" stroke-linecap="round"></path>
      </svg>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
