<!doctype html>

<x-dc>

<div style="width: 390px; height: 844px; background: #14140f; color: #fbf9f4; display: flex; flex-direction: column; overflow: hidden">

    <div style="display: flex; align-items: center; gap: 14px; align-self: flex-start; background: #6fd3ad; color: #06251b; border-radius: 999px; padding: 0 30px 0 24px; height: 78px">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 L19 12 L8 19 Z" fill="#06251b"></path></svg>
      <div style="font-size: 23px; font-weight: 700">福建话讲一遍</div>
